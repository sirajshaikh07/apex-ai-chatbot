# Nginx Reverse Proxy Configuration for APEX + Real-Time Token Streaming
# Listens on port 8080 (Publicly accessible, same-origin, zero CORS issues)

server {
    listen 8080 default_server;
    listen [::]:8080 default_server;
    server_name _;

    client_max_body_size 100M;

    # 1. Real-Time Token Streaming Endpoint (SSE)
    location /api/chat/stream {
        proxy_pass http://127.0.0.1:5056/api/chat/stream;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 2. Oracle REST Data Services (ORDS) & APEX Engine
    location /ords/ {
        proxy_pass http://127.0.0.1:8088/ords/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_connect_timeout 600s;
    }

    # 3. APEX Static Images & JavaScript
    location /i/ {
        alias /opt/apex/images/;
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }

    # Root redirect to chat app
    location = / {
        return 302 /ords/r/aiworkspace/chatapp;
    }
}
